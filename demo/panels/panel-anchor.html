<section class="section" id="panel-anchor">
    <h2><code>&lt;a&gt;</code> — a <code>&lt;g&gt;</code>-like wrapper that turns its children into a
        hyperlink</h2>
    <figure>
        <div class="canvas" id="demo-anchor"></div>
        <figcaption>
            <ul>
                <li><strong>Link A</strong> A circle and its label, both appended to one
                    <code>&lt;a&gt;</code>. Both become part of the same hyperlink. Clicking either one
                    navigates to the image demo.
                </li>
                <li><strong>Link B</strong> The same wrapping as Link A. It also sets
                    <code>target="_blank"</code> via the generic <code>set_attr</code> escape hatch. This
                    opens the demo in a new browser tab.
                </li>
            </ul>
            <p>Both links use a same-document fragment <code>href</code> here purely so clicking inside this
                demo does not navigate away from the gallery.</p>
        </figcaption>
    </figure>
</section>
