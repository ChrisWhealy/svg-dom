<!-- linearGradient -->
<section class="section" id="panel-linear-gradient">
    <h2><code>&lt;linearGradient&gt;</code> — colour transitions along a line</h2>
    <figure>
        <div class="canvas" id="demo-linear-gradient"></div>
        <figcaption>
            <ul>
                <li>
                    <strong>horizontal</strong>: default left-to-right axis
                </li>
                <li>
                    <strong>vertical</strong>: <code>x2="0" y2="1"</code>
                </li>
                <li>
                    <strong>diagonal</strong>: <code>gradientTransform="rotate(45)"</code>
                </li>
                <li>
                    <strong>4-stop spectrum</strong>: <code>stop-color</code> values defined for each stop
                </li>
                <li>
                    <strong>gradient stroke</strong>: <code>stroke</code> property on a
                    <code>&lt;path&gt;</code> element
                </li>
            </ul>
        </figcaption>
    </figure>
</section>
