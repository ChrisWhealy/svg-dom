<!-- linearGradient -->
<section class="section" id="panel-linear-gradient">
    <h2><code>&lt;linearGradient&gt;</code> — colour transitions along a line</h2>
    <figure>
        <div class="canvas" id="demo-linear-gradient"></div>
        <figcaption>
            <ul>
                <li>
                    <strong>horizontal</strong>: default left-to-right axis. Drag the slider above it to shift the
                    second stop left and right.
                </li>
                <li>
                    <strong>vertical</strong>: <code>x2="0" y2="1"</code>. Drag the slider beside it to shift the
                    second stop up and down.
                </li>
                <li>
                    <strong>diagonal</strong>: <code>gradientTransform="rotate(x)"</code>, starting at 45°. Drag the
                    slider to rotate it up to 90° either way.
                </li>
                <li>
                    <strong>4-stop spectrum</strong>: <code>stop-color</code> values defined for each stop. Two
                    sliders move the middle two stops, each kept between its neighbours.
                </li>
                <li>
                    <strong>gradient stroke</strong>: <code>stroke</code> property on a
                    <code>&lt;path&gt;</code> element
                </li>
            </ul>
        </figcaption>
    </figure>
</section>
