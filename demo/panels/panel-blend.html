<!-- feBlend -->
<section class="section" id="panel-blend">
    <h2><code>&lt;feBlend&gt;</code> — colour blending, independent of the shadow primitives</h2>
    <figure>
        <div class="canvas" id="demo-blend"></div>
        <figcaption>
            <p>
                Two copies of the same multi-hue gradient <strong>circle</strong>. The left one has no filter. The right
                one references a <code>&lt;filter&gt;</code> built with <strong>flood</strong> (a fixed orange tint),
                then <strong>blend</strong>, then a final <strong>composite(In)</strong>.
            </p>
            <p>
                The dropdown above the right circle picks <code>blend</code>'s own <code>BlendMode</code> live.
                It offers all sixteen standard <code>&lt;blend-mode&gt;</code> keywords, the same set CSS compositing
                uses. CSS <code>mix-blend-mode</code> also defines two CSS-only modes. This crate does not offer those
                two. SVG filters blend in <code>linearRGB</code> by default. CSS blends in <code>sRGB</code> by default
                instead. The same mode can therefore look different here than in CSS. Set
                <code>color-interpolation-filters="sRGB"</code> to match CSS.
            </p>
            <p>
                <strong>Why a circle, not a rectangle?</strong><br>
                <code>flood</code> paints its colour opaquely across the entire filter region.
                <code>blend</code> alone only changes colour, not alpha. Without a final
                <code>composite(In)</code> step, the flood colour would leak through the fully
                transparent corners of the circle's bounding box. <code>composite(In)</code> clips the
                result back to the circle's own alpha coverage. A rectangle has no transparency there to
                reveal the mistake.
            </p>
        </figcaption>
    </figure>
</section>
