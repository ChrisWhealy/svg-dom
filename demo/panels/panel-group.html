<!-- group -->
<section class="section" id="panel-group">
    <h2><code>&lt;g&gt;</code> — group</h2>
    <figure>
        <div class="canvas" id="demo-group"></div>
        <figcaption>
            <p>Three groups share the same local element coordinates.</p>
            <p>Groups A and B are repositioned as a unit with <code>transform="translate(...)"</code></p>
            <p>Group C is positioned and sheared with a single call to <strong>set_matrix</strong>.
                None of the named translate/rotate/scale helpers can produce a shear.
                <strong>set_matrix</strong> is the one way to add one.
            </p>
            <p>The dashed connectors are drawn in SVG root space.</p>
        </figcaption>
    </figure>
</section>
