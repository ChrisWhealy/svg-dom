<!-- classList -->
<section class="section" id="panel-events-classlist">
    <h2>Use CSS <code>class</code> to Change Element Appearance</h2>
    <figure>
        <div class="canvas" id="demo-events-classlist"></div>
        <figcaption>
            <p>When you click a tile, <strong>on_click</strong> calls
                <strong>toggle_class("selected")</strong>.
            </p>
            <p>The gold highlight comes entirely from a <code>.tile.selected</code> CSS rule. The
                readout is recomputed from <strong>has_class</strong> on every tile, after each
                click.</p>
        </figcaption>
    </figure>
</section>
