<section class="section" id="panel-ellipse">
    <h2><code>&lt;ellipse&gt;</code></h2>
    <figure>
        <div class="canvas" id="demo-ellipse"></div>
        <figcaption>
            <p>An ellipse has two perpendicular radii, the major and minor axes.</p>
            <p>A circle is a special case of an ellipse. Its major and minor axes are equal.</p>
            <ul>
                <li><strong>wide</strong> (rx &gt; ry)</li>
                <li><strong>tall stroke-only</strong> (ry &gt; rx)</li>
                <li><strong>hover</strong> Both radii grow on pointerenter.
                </li>
            </ul>
        </figcaption>
    </figure>
</section>
