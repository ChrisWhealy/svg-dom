                <figure>
                    <div class="canvas" id="demo-events-colour"></div>
                    <figcaption>
                        <p>Move the pointer over the wheel</p>
                        <p>Each <strong>mousemove</strong> reads <code>MouseEvent.offsetX / offsetY</code>, derives a
