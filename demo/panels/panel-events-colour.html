<!-- colour wheel -->
<section class="section" id="panel-events-colour">
    <h2><code>mousemove</code> — colour wheel</h2>
    <figure>
        <div class="canvas" id="demo-events-colour"></div>
        <figcaption>
            <p>Move the pointer over the wheel</p>
            <p>Each <strong>mousemove</strong> reads <code>MouseEvent.offsetX</code> and
                <code>offsetY</code>. It derives a hue from the pointer's angle. It then recolours the
                swatch on the right.
            </p>
            <p>One transparent surface captures the pointer. So the cursor never flickers.</p>
        </figcaption>
    </figure>
</section>
