<!-- switch -->
<section class="section" id="panel-switch">
    <h2><code>&lt;switch&gt;</code> — renders at most one direct child</h2>
    <figure>
        <div class="canvas" id="demo-switch"></div>
        <figcaption>
            The <code>switch</code> logic here is based on the value of <code>systemLanguage</code>.
            <ul>
                <li><strong>no child matches, so the fallback renders</strong> SVG 2 defines an empty
                    <code>systemLanguage=""</code> as always false. The first child is guaranteed to
                    fail. <code>&lt;switch&gt;</code> then falls through to the attribute-free fallback
                    colour, steelblue.
                </li>
                <li><strong>attribute-free first child always matches</strong> A child with no
                    conditional attributes is always true. It renders immediately. The second child,
                    darkorange, is never reached. Both outcomes are deterministic in every browser and
                    locale. A real <code>systemLanguage</code> match would instead depend on the locale
                    running the demo.
                </li>
            </ul>
        </figcaption>
    </figure>
</section>
