<!-- feDiffuseLighting / feSpecularLighting -->
<section class="section" id="panel-lighting">
    <h2><code>&lt;feDiffuseLighting&gt;</code> / <code>&lt;feSpecularLighting&gt;</code> — bump-mapped
        lighting</h2>
    <figure>
        <div class="canvas" id="demo-lighting"></div>
        <figcaption>
            <ul>
                <li><strong>original</strong>: Bold text, no filter</li>
                <li><strong>feDiffuseLighting (opaque)</strong> A matte, Lambertian, surface lit from
                    the upper-left. The result is fully opaque, per the SVG spec. So with no further
                    compositing, this renders as a flat lit plate with the text embossed into it.</li>
                <li><strong>feSpecularLighting (highlight)</strong> The shiny, Blinn&ndash;Phong,
                    counterpart from the same light. Its alpha is the maximum of its own lit R/G/B. So
                    it renders as a highlight-only glint against the dark canvas. It is transparent
                    everywhere the highlight itself is zero.</li>
                <li><strong>combined bevel</strong> The classic recipe. The opaque diffuse-lit surface
                    is multiplied back over the original text, using <code>composite(Arithmetic)</code>
                    with <code>k1: 1.0</code>. Then the specular highlight is added on top, using
                    <code>composite(Arithmetic)</code> with <code>k2</code>/<code>k3: 1.0</code>.
                </li>
            </ul>
            <p>
                Both primitives treat their input's alpha channel as a bump map. They light it with a
                <code>LightSource</code>: <strong>Distant</strong> (parallel rays, like sunlight),
                <strong>Point</strong> (radiating from a position, like a bare bulb), or
                <strong>Spot</strong> (aimed at a target, optionally narrowed to a cone). Every panel
                above uses the same <strong>Distant</strong> light, so the emboss direction reads
                consistently.
            </p>
            <p>
                <code>feDiffuseLighting</code>'s opacity and <code>feSpecularLighting</code>'s
                transparency are not interchangeable. Merging or blending the opaque diffuse result
                directly over <code>SourceGraphic</code> would hide the original entirely. This is why
                the combined panel uses <code>composite(Arithmetic)</code> with different coefficients
                for each: a multiply for the opaque diffuse layer, a plain sum for the non-opaque
                specular highlight.
            </p>
        </figcaption>
    </figure>
</section>
