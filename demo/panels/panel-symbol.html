<!-- symbol -->
<section class="section" id="panel-symbol">
    <h2><code>&lt;symbol&gt;</code> — reusable scaled viewport</h2>
    <figure>
        <div class="canvas" id="demo-symbol"></div>
        <figcaption>
            <p>
                A badge icon defined once in <code>&lt;defs&gt;</code>, with <strong>viewBox="0 0 40
                    40"</strong>. It is stamped five times at increasing sizes via
                <strong>use_node</strong>.
            </p>
            <p>
                The <code>viewBox</code> scales the content automatically, to fit each
                <code>&lt;use&gt;</code> element's <code>width</code> and <code>height</code>. No manual
                rescaling is needed.
            </p>
        </figcaption>
    </figure>
</section>
