<!-- feComponentTransfer -->
<section class="section" id="panel-component-transfer">
    <h2><code>&lt;feComponentTransfer&gt;</code> — per-channel remap, independent of the shadow
        primitives</h2>
    <figure>
        <div class="canvas" id="demo-component-transfer"></div>
        <figcaption>
            <p>
                Four copies of the same multi-hue gradient rectangle, each referencing a separate
                <code>&lt;filter&gt;</code> built with <strong>component_transfer</strong>. The left
                one has no filter. Each of the other three has its own slider above it, driving one
                <code>TransferFunction</code> live.
            </p>
            <ul>
                <li><strong>Gamma exponent</strong>: applied identically to red/green/blue. Above 1.0
                    it darkens midtones. Below 1.0 it brightens them.</li>
                <li><strong>Steps</strong>: applied identically to red/green/blue. Posterises the
                    smooth gradient into that many hard colour bands.</li>
                <li><strong>Alpha slope</strong>: applied only to alpha. Fades the rectangle toward
                    the dark canvas background without touching its colour at all.</li>
            </ul>
            <p>
                Each channel is independent. A <code>(Channel, TransferFunction)</code> pair not
                mentioned gets no <code>&lt;feFuncX&gt;</code> child at all. This is the SVG default,
                equivalent to <code>TransferFunction::Identity</code>. This is why the alpha slider
                above leaves colour completely untouched, at every position.
            </p>
        </figcaption>
    </figure>
</section>
