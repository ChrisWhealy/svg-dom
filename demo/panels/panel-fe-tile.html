<!-- feTile -->
<section class="section" id="panel-fe-tile">
    <h2><code>&lt;feTile&gt;</code> — repeat a filter-generated tile across the filter region</h2>
    <figure>
        <div class="canvas" id="demo-fe-tile"></div>
        <figcaption>
            <ul>
                <li><strong>narrow tile (unrepeated)</strong> <code>turbulence</code> is narrowed to a
                    20&times;20 subregion. Everything outside that corner stays transparent. This shows
                    exactly the rectangle <code>tile</code> would otherwise repeat.</li>
                <li><strong>feTile (visible seams)</strong> The same narrowed noise, repeated by
                    <code>tile</code> across the whole filter region. Plain noise is not periodic at an
                    arbitrary width or height. So the seams between copies are visible.
                </li>
                <li><strong>feTile + stitchTiles</strong> <code>stitchTiles="stitch"</code> makes the
                    noise exactly periodic across its own subregion first. So the seams disappear.
                </li>
            </ul>
            <p>
                <code>feTile</code> has no numeric or enum-valued attributes needing a typed parameter. It
                accepts the optional input selector <code>in</code>, together with the common
                filter-primitive attributes <code>x</code>, <code>y</code>, <code>width</code>,
                <code>height</code>, and <code>result</code>.
            </p>
            <p>
                It does not choose what gets repeated. That choice is entirely the <em>input</em>
                primitive's own subregion. Here, that input is <code>turbulence</code>, a generator with
                no referenced input.
            </p>
            <p>
                A generator's default subregion is therefore the whole filter region. An ordinary
                primitive's default would instead be the union of its referenced input's subregion.
                Left unnarrowed, there would be nothing smaller than the filter region to repeat.
                <code>tile</code>'s output would then be indistinguishable from its input.
            </p>
            <p>
                This is the filter-graph counterpart to <code>SvgDefs::pattern</code>. A
                <code>&lt;pattern&gt;</code> is a paint server, applied via <code>fill</code> or
                <code>stroke</code>. <code>feTile</code> instead repeats a filter-generated tile as one
                step inside a filter graph. So its output can feed further primitives, the same way any
                other primitive's output can.
            </p>
        </figcaption>
    </figure>
</section>
