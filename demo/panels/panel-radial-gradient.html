<!-- radialGradient -->
<section class="section" id="panel-radial-gradient">
    <h2><code>&lt;radialGradient&gt;</code> — colour transitions radiating from a focal point</h2>
    <figure>
        <div class="canvas" id="demo-radial-gradient"></div>
        <figcaption>
            <ul>
                <li>
                    <strong>centred</strong>: <code>cx/cy/r = 0.5</code>. Drag the slider above it to shift the
                    middle stop along the radius.
                </li>
                <li>
                    <strong>spreadMethod</strong>: tight radius (concentric rings). Choose Pad, Reflect, or
                    Repeat.
                </li>
                <li>
                    <strong>off-centre focal</strong>: starts at <code>fx="0.25" fy="0.25"</code>. Drag the
                    sliders to move the focal point.
                    Values near the corners move it outside the end circle.
                    Under SVG 2, areas outside the resulting gradient cone stay transparent.
                    A small marker on the rectangle always shows the current focal point.
                </li>
                <li>
                    <strong>ellipse metallic sheen</strong>: <code>objectBoundingBox</code> adapts to the
                    shape.
                </li>
            </ul>
        </figcaption>
    </figure>
</section>
