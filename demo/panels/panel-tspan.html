<!-- tspan -->
<section class="section" id="panel-tspan">
    <h2><code>&lt;tspan&gt;</code> — inline text spans within <code>&lt;text&gt;</code></h2>
    <figure>
        <div class="canvas" id="demo-tspan"></div>
        <figcaption>
            <ul>
                <li>
                    <strong>multi-line</strong> A text element containing three
                    <code>&lt;tspan&gt;</code> elements.
                    <p>Each span uses <strong>tspan_dy</strong> to move the text down by 22&thinsp;px. This gives line
                        breaks without the need to calculate any absolute <code>y</code> coordinates.</p>
                </li>
                <li>
                    <strong>inline mixed styles</strong> A <code>&lt;text&gt;</code> element containing
                    three spans. Each span has its own <code>fill</code> and <code>font-size</code>.
                </li>

            </ul>
        </figcaption>
    </figure>
</section>
