<!-- mask -->
<section class="section" id="panel-mask">
    <h2><code>&lt;mask&gt;</code> — reveal/hide by luminance or alpha</h2>
    <figure>
        <div class="canvas" id="demo-mask"></div>
        <figcaption>
            <ul>
                <li><strong>luminance gradient fade</strong>: A white-to-black gradient fades a solid rect
                    from opaque to invisible, the default <strong>mask-type: luminance</strong></li>
                <li><strong>text mask</strong>: A black backing hides everything except a white "SVG"
                    cut-out</li>
                <li><strong>alpha mask on a group</strong>: Two identically coloured circles revealed at
                    different strengths purely by the mask shape's <code>fill-opacity</code>, not its
                    colour</li>
            </ul>
        </figcaption>
    </figure>
</section>
