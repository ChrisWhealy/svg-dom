<!-- clipPath -->
<section class="section" id="panel-clip-path">
    <h2><code>&lt;clipPath&gt;</code> — mask elements to a shape</h2>
    <figure>
        <div class="canvas" id="demo-clip-path"></div>
        <figcaption>
            <ul>
                <li><strong>circle clip</strong>: gradient rect visible only through a circular aperture
                </li>
                <li><strong>polygon clip</strong>: radial gradient revealed through a hexagon</li>
                <li><strong>group clip</strong>: three coloured bands clipped to an arrow path,
                    demonstrating that <code>clip-path</code> applies to <code>&lt;g&gt;</code> elements
                    too</li>
            </ul>
        </figcaption>
    </figure>
</section>
