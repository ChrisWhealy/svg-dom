            <!-- image -->
            <section class="section" id="panel-image">
                <h2><code>&lt;image&gt;</code> — embed a raster or SVG image</h2>
                <figure>
                    <div class="canvas" id="demo-image"></div>
                    <figcaption>
                        <p>
                            A four-quadrant colour grid image has a natural size of 60&times;40 pixels.
                            A small dot marks a point near its left edge.
                        </p>
                        <p>
                            The image sits inside a 100&times;100 box.
                            Radio buttons choose the box's <strong>preserveAspectRatio</strong> value.
                            Watch the dot and the grey guide outline as you switch between them:
                        </p>
                        <ul>
                            <li><strong>meet</strong> (default) shrinks the whole image to fit inside the box.
                                Empty canvas-background bands appear above and below. The dot stays visible.</li>
                            <li><strong>none</strong> stretches the image to fill the box exactly.
                                This distorts the image's aspect ratio. No bars appear, and the dot stays visible.</li>
                            <li><strong>slice</strong> scales the image up to fill the box.
                                This crops the sides. The crop removes the dot entirely.</li>
                        </ul>
                        <p>
                            A second image on the right demonstrates <code>set_href</code>.
                            This method swaps the image source after creation.
                        </p>
                    </figcaption>
                </figure>
            </section>
