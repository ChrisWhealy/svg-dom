            <!-- textPath -->
            <section class="section" id="panel-text-path">
                <h2><code>&lt;textPath&gt;</code> — gluing text to a curve</h2>
                <figure>
                    <div class="canvas" id="demo-text-path"></div>
                    <figcaption>
                        <ul>
                            <li>
                                <strong>Text follows a curve</strong>: Text runs along a sine curve defined (and hidden)
                                in <code>&lt;defs&gt;</code>
                            </li>
                            <li><strong>startOffset</strong>: Drag the slider above the dashed arc to set
                                <code>&lt;textPath&gt;</code>'s <strong>set_start_offset</strong> live — the range
                                runs from <code>0</code> to the arc's own measured <code>total_length()</code>,
                                truncated to a whole user unit so the slider can never select a distance past the
                                path's real end. The label reads <code>white</code> at the home position (offset 0)
                                and orange anywhere else along the path.
                            </li>
                        </ul>
                    </figcaption>
                </figure>
            </section>
