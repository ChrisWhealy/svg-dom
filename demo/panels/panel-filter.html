<!-- filter -->
<section class="section" id="panel-filter">
    <h2><code>&lt;filter&gt;</code> — raster effects via <code>&lt;feGaussianBlur&gt;</code>,
        <code>&lt;feDropShadow&gt;</code>
    </h2>
    <figure>
        <div class="canvas" id="demo-filter"></div>
        <figcaption>
            <p>
                Four identical circles, each referencing a separate <code>&lt;filter&gt;</code> defined in
                <code>&lt;defs&gt;</code> and applied via <strong>set_filter</strong>:
            </p>
            <p>
                <strong>stdDeviation</strong>: 0 (no blur), 3, 6, 12
            </p>
            <p>
                <strong>tinted drop-shadow banner</strong> uses the single <code>feDropShadow</code>
                primitive. This is the browser-native shorthand for the chain
                <code>feGaussianBlur</code> (on <code>SourceAlpha</code>) → <code>feFlood</code> →
                <code>feComposite</code> → <code>feOffset</code> → <code>feMerge</code>. Its flood
                colour is independent of the text's own fill. It is applied to real
                <code>&lt;text&gt;</code> content, the effect's most common real-world use.
            </p>
            <p>Each filter widens its region beyond the SVG default so nothing is clipped at the edge.</p>
        </figcaption>
    </figure>
</section>
