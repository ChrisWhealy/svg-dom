<!-- filter -->
<section class="section" id="panel-filter">
    <h2><code>&lt;filter&gt;</code> — raster effects via <code>&lt;feGaussianBlur&gt;</code>,
        <code>&lt;feDropShadow&gt;</code>
    </h2>
    <figure>
        <div class="canvas" id="demo-filter"></div>
        <figcaption>
            <p>
                One circle references a <code>&lt;filter&gt;</code> defined in <code>&lt;defs&gt;</code> and
                applied via <strong>set_filter</strong>.
            </p>
            <p>
                Drag the <strong>blur</strong> slider above it to change <strong>stdDeviation</strong> live,
                from 0 (no blur) to 20.
            </p>
            <p>
                <strong>tinted drop-shadow banner</strong> uses the single <code>feDropShadow</code>
                primitive. This is the browser-native shorthand for the chain
                <code>feGaussianBlur</code> (on <code>SourceAlpha</code>) → <code>feOffset</code> →
                <code>feFlood</code> → <code>feComposite</code> → <code>feMerge</code>. Its flood
                colour is independent of the text's own fill. It is applied to real
                <code>&lt;text&gt;</code> content, a common real-world use.
            </p>
            <p>
                Three sliders control the shadow live. <strong>dx</strong> (above the banner) and
                <strong>dy</strong> (left of the banner) shift the shadow's offset from -10 to 10.
                <strong>blur</strong> (below the banner) changes the shadow's own <strong>stdDeviation</strong>
                from 0 to 20, independently of the circle's own blur slider.
            </p>
            <p>
                A filter region is a hard clip, so the SVG default is too tight for these sliders' own maximum
                values. Each region here is sized against its own maximum stdDeviation and offset instead.
                Every extreme combination was checked and shows no clipping.
            </p>
        </figcaption>
    </figure>
</section>
