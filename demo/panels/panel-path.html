<!-- path -->
<section class="section" id="panel-path">
    <h2><code>&lt;path&gt;</code></h2>
    <figure>
        <div class="canvas" id="demo-path"></div>
        <figcaption>
            <p>The following paths are formed from a sequence of <code>PathDef</code> commands.</p>
            <p><strong>All valid path definitions must start with a "move" (<code>M</code>)
                    command!</strong></p>
            <ul>
                <li><strong>M L L Z</strong> Move + LineTo + LineTo + ClosePath forms a closed triangle.
                </li>
                <li><strong>M Q Q</strong> Move + Quadratic Bézier + Quadratic Bézier forms a wave.</li>
                <li><strong>M A</strong> Move + Elliptical Arc forms a semicircle.</li>
            </ul>
        </figcaption>
    </figure>
</section>
