<!-- feMorphology -->
<section class="section" id="panel-morphology">
    <h2><code>&lt;feMorphology&gt;</code> — component-wise minimum/maximum over a radius</h2>
    <figure>
        <div class="canvas" id="demo-morphology"></div>
        <figcaption>
            <ul>
                <li><strong>original</strong>: Bold text, no filter</li>
                <li>
                    <p><strong>radius</strong> slider drives both <strong>Erode</strong> and <strong>Dilate</strong>.
                        At radius 0, <code>morphology</code> disables itself and both columns then match the original
                        exactly.</p>
                    <p>Higher radii shrink <strong>Erode</strong>'s own strokes further. The real purpose of erosion is
                        to show that past a certain radius, thin strokes vanish completely. This is not a rendering
                        fault.</p>
                    <p>Dilate works in the opposite way. As the slider value increases, tightly-spaced letters are fused
                        into one solid shape.</p>
                </li>
                <li><strong>bold outline</strong> <code>morphology</code> dilates <code>SourceAlpha</code>, named via
                    <code>result</code>. <code>merge</code> then stacks it underneath the original text with only the
                    extended fringe showing through.<br>
                    This gives a bolder outline. It leaves the fully opaque interior of the glyphs unchanged, although
                    the black layer can slightly darken their antialiased edge pixels. The same <strong>radius</strong>
                    slider above also drives this column. A thicker outline at higher radii shows the same growing
                    dilation, through this different compositing technique.
                </li>
            </ul>
            <p>
                <code>feMorphology</code> takes a per-pixel minimum (<strong>Erode</strong>) or maximum
                (<strong>Dilate</strong>). It works across the input's premultiplied R/G/B/A channels,
                within <strong>radius</strong>.
            </p>
            <p>
                The direct <strong>Erode</strong> and <strong>Dilate</strong> panels above operate on
                their implicit <code>SourceGraphic</code> input. Neither sets <code>in</code>, and each
                is the first primitive in its own filter.
            </p>
            <p>
                This source text has a single, uniform colour. So taking the minimum or maximum across
                colour channels has no visible effect here, beyond the alpha silhouette. That is a
                property of this particular source, not a guarantee of the primitive.
            </p>
            <p>
                The <strong>bold outline</strong> panel instead explicitly sets <code>in</code> to
                <code>SourceAlpha</code>. Alpha is the only non-degenerate channel there, by
                construction. This choice is deliberate: an uncomposited <code>SourceAlpha</code> result
                has zero-valued colour channels. Merging it back with <code>SourceGraphic</code> would
                not otherwise preserve the text's own steel-blue fill.
            </p>
            <p>
                Zero-valued colour channels also make the exposed fringe plain black. A white
                rectangle sits behind this column only, so that fringe stays visible against this
                gallery's own dark canvas.
            </p>
        </figcaption>
    </figure>
</section>
