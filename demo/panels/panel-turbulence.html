<!-- feTurbulence / feDisplacementMap -->
<section class="section" id="panel-turbulence">
    <h2><code>&lt;feTurbulence&gt;</code> / <code>&lt;feDisplacementMap&gt;</code> — generated noise
        and noise-driven distortion</h2>
    <figure>
        <div class="canvas" id="demo-turbulence"></div>
        <figcaption>
            <ul>
                <li><strong>original</strong>: A plain circle, no filter</li>
                <li><strong>FractalNoise</strong>: Raw <code>turbulence</code> output is softer, cloud-like
                </li>
                <li><strong>Turbulence</strong>: The same call with the higher-contrast, marbled
                    <code>TurbulenceType</code> instead
                </li>
                <li><strong>organic edge</strong> <code>turbulence</code> is named via
                    <code>result</code>. <code>displacement_map</code> then uses its
                    <strong>Red</strong> and <strong>Green</strong> channels to drive the horizontal and
                    vertical warp separately. <code>turbulence</code> generates these two channels
                    independently. This gives the circle's edge a hand-drawn, non-geometric outline that
                    moves freely in two dimensions. This illustrates the standard pairing these two
                    primitives exist for.
                </li>
            </ul>
            <p>
                The two noise-only panels use a plain rectangle, not a circle.
                <code>feTurbulence</code> reads no <code>in</code> at all. So its output covers the
                entire, rectangular, filter region, not just the referencing element's own shape.
                Applying it to a circle would visibly replace the circle with a square patch of noise.
            </p>
        </figcaption>
    </figure>
</section>
