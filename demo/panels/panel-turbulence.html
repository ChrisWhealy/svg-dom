<!-- feTurbulence / feDisplacementMap -->
<section class="section" id="panel-turbulence">
    <h2><code>&lt;feTurbulence&gt;</code> / <code>&lt;feDisplacementMap&gt;</code> — generated noise
        and noise-driven distortion</h2>
    <figure>
        <div class="canvas" id="demo-turbulence"></div>
        <figcaption>
            <ul>
                <li><strong>original</strong>: A plain circle, no filter</li>
                <li><strong>FractalNoise</strong> / <strong>Turbulence</strong>: the same <code>baseFrequency</code>
                    slider drives both rectangles live. <code>FractalNoise</code> is softer and cloud-like.
                    <code>Turbulence</code> is higher-contrast and marbled, from the same call with a different
                    <code>TurbulenceType</code>.
                </li>
                <li><strong>organic edge</strong>: three sliders drive <code>displacement_map</code> live. Its own
                    <code>scale</code> slider sets the maximum displacement. At scale 0 the circle is a perfect
                    geometric shape again. Higher values warp its edge into a more hand-drawn, non-geometric outline.
                    Its own <strong>x channel</strong> and <strong>y channel</strong> sliders each pick one of
                    <code>turbulence</code>'s four independently generated channels. <code>turbulence</code> is named
                    via <code>result</code> so <code>displacement_map</code> can read it. Picking two different channels
                    lets the warp move freely in two dimensions. Picking the same channel for both confines every
                    displacement vector to one diagonal instead. Try Alpha for both to see it happen.
                </li>
            </ul>
            <p>
                The two noise-only panels use a plain rectangle, not a circle. <code>feTurbulence</code> reads no
                <code>in</code> at all. So its output covers the entire, rectangular, filter region, not just the
                referencing element's own shape. Applying it to a circle would visibly replace the circle with a square
                patch of noise.
            </p>
        </figcaption>
    </figure>
</section>
