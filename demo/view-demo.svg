<!--
  Hand-authored standalone SVG fixture for the <view> demo panel (see demo-app/src/structure/demo_view.rs).

  This file is deliberately not built using svg-dom.
  <view>'s fragment-navigation effect only applies to an SVG resource referenced externally.
  Here, that means an <image href="view-demo.svg#id">, set from a Rust on_click handler in the live demo.
  It never applies to a live, already-attached DOM handle the caller already has.
  Every other panel in this gallery demonstrates that live-handle case instead.
  This file is what gets exported and served independently.
  The surrounding gallery page is not.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <view id="top-left" viewBox="0 0 100 100"/>
  <view id="bottom-right" viewBox="100 100 100 100"/>

  <rect width="100" height="100" fill="steelblue"/>
  <rect x="100" width="100" height="100" fill="coral"/>
  <rect y="100" width="100" height="100" fill="gold"/>
  <rect x="100" y="100" width="100" height="100" fill="mediumseagreen"/>
</svg>
