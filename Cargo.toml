[workspace]
members = ["demo-app", "demo-server", "cdp-test-fixture", "cdp-integration-test"]
# Keep plain `cargo build` / `cargo test` focused on the library; the demo-app (the interactive gallery,
# consuming svg-dom only through its public API) and the demo server (which pulls in actix) are built only
# on demand via `cargo demo`, and the cdp-test-fixture wasm crate plus its headless_chrome-driven CDP tests
# are built only on demand via `cargo test -p cdp-integration-test`.
default-members = ["."]

[package]
name = "svg-dom"
authors = ["Chris Whealy <chris@whealy.com>"]
version = "0.2.13"
edition = "2024"
rust-version = "1.85"
description = "A lightweight Rust/WebAssembly library for creating and mutating live SVG content directly in the browser DOM"
keywords = ["svg", "wasm", "browser", "dom"]
categories = ["wasm", "web-programming", "rendering"]
repository = "https://github.com/ChrisWhealy/svg-dom"
license = "MIT"
readme = "README.md"
exclude = [
    ".editorconfig",
    ".github/",
    "demo/",
    "deny.toml",
    "docs/design_notes/rejected_ideas/",
    "rustfmt.toml",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "AddEventListenerOptions",
    "Document",
    "DocumentFragment",
    "DomRect",
    "DomTokenList",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "FocusEvent",
    "HtmlCollection",
    "KeyboardEvent",
    "MouseEvent",
    "NodeList",
    "PointerEvent",
    "Node",
    "SvgElement",
    "SvgGeometryElement",
    "SvgGraphicsElement",
    "SvgMatrix",
    "SvgPoint",
    "SvgRect",
    "SvgsvgElement",
    "SvgTextContentElement",
    "Text",
    "TouchEvent",
    "WheelEvent",
    "Window",
]

[dev-dependencies]
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"

[dev-dependencies.web-sys]
version = "0.3"
features = [
    "AbortController",
    "AbortSignal",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "DocumentFragment",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "FocusEvent",
    "HtmlCanvasElement",
    "ImageData",
    "KeyboardEvent",
    "MouseEvent",
    "Node",
    "PointerEvent",
    "SvgImageElement",
    "SvgPoint",
    "SvgTextContentElement",
    "TouchEvent",
    "Window",
    "WheelEvent",
    "XmlSerializer",
]
