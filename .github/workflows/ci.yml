name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt · clippy · test · doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy (library + tests)
        run: cargo clippy --lib --tests -- -D warnings

      - name: Unit tests + doctests
        run: cargo test --all-features

      # The workspace's default-members is just the root package, so none of the above select the other workspace crates
      # — demo-server and svg-dom-demo (demo-app) each need an explicit `-p` invocation, same as accessibility-tree-test
      # already gets in the `accessibility-tree-test` job below. Both build and run natively (svg-dom-demo depends on
      # web-sys/wasm-bindgen, but nothing in its host-runnable unit tests — see demo-app/src/highlight/unit_tests.rs —
      # touches an actual browser API), so they belong here rather than in the `wasm` job, which is about the wasm32
      # *target* build specifically.
      - name: Clippy (demo-server)
        # --all-targets, not a plain `-p demo-server`: #[cfg(test)] code (panels.rs's test module) is only compiled
        # in test mode, so a plain clippy invocation here would silently never lint it at all.
        run: cargo clippy -p demo-server --all-targets -- -D warnings

      - name: Unit tests (demo-server)
        run: cargo test -p demo-server

      # demo-server's own unit tests (panels/validate/build) already cover each phase in isolation with synthetic
      # fixtures, but this exercises the real pipeline end to end — catalogue validation, fragment validation,
      # template assembly, port substitution, and asset staging, wired together the way `cargo demo` actually runs
      # them — without paying for a full `wasm-pack build` (the `wasm` job below already covers that separately).
      # See demo-server/src/build/mod.rs's doc comment for why prepare_gallery is split out from build_gallery.
      - name: Demo gallery staging check (validate + assemble, no wasm build)
        run: cargo run -p demo-server -- --prepare-only

      # Native, not the `wasm` job's `--target wasm32-unknown-unknown` clippy step below: that one only lints the
      # normal (non-test) build, so it never sees #[cfg(test)] code either — same gap as demo-server's clippy step
      # above, for the same reason. demo-app/src/highlight/unit_tests.rs is what this actually catches.
      - name: Clippy (svg-dom-demo tests)
        run: cargo clippy -p svg-dom-demo --all-targets -- -D warnings

      - name: Unit tests (svg-dom-demo)
        run: cargo test -p svg-dom-demo

      - name: Docs (deny warnings)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    name: wasm build · README example · demo-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Compile README minimal demo for wasm32
        run: cargo build --example readme_minimal --target wasm32-unknown-unknown

      # `demo-app` (package `svg-dom-demo`) is a separate workspace crate that depends on `svg-dom` only via a plain
      # `Cargo.toml` path dependency, reaching it exclusively through its public API — the same way any external
      # consumer would. Building and linting it here is therefore also a standing check that the library's public
      # surface is sufficient to build a real, full-featured application: a demo that accidentally relied on a
      # private/internal item would simply fail to compile.
      - name: Build demo-app against the library's public API
        run: cargo build -p svg-dom-demo --target wasm32-unknown-unknown

      - name: Clippy (demo-app)
        run: cargo clippy -p svg-dom-demo --target wasm32-unknown-unknown -- -D warnings

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned rather than left at the action's default "latest": with no version pinned, every run does an
          # extra "search latest release" round-trip against the GitHub API/CDN before downloading it, which is
          # both non-reproducible (a new wasm-pack release can silently change CI behaviour) and one more place a
          # transient failure (e.g. a release-download 504) can break an otherwise-unrelated change. Bump this
          # deliberately when a newer wasm-pack is actually needed.
          version: "v0.15.0"

      - name: wasm-pack build (the published web artifact)
        run: wasm-pack build --target web

      - name: wasm-pack build (the demo gallery, same invocation `cargo demo` uses)
        run: wasm-pack build demo-app --target web --out-dir ../pkg

  browser-tests:
    name: wasm-pack test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      # Don't let one engine failing cancel the other — we want to see which broke.
      fail-fast: false
      matrix:
        # The two distinct engines available on Linux runners: Gecko (Firefox) and Blink
        # (Chrome — also covers Edge and most mobile webviews). WebKit/Safari needs a macOS
        # runner and lacks reliable headless support, so it is intentionally omitted.
        browser: [firefox, chrome]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # `ubuntu-latest` runners default to Ubuntu 24.04, which enables AppArmor's unprivileged-user-namespace
      # restriction by default. Firefox's (and Chromium's) content sandbox needs one, so headless launch fails with
      # "Exiting due to channel error" and the browser process gets SIGKILLed before geckodriver/chromedriver can
      # talk to it — a CI/kernel-policy issue, not a test or crate bug. AppArmor causing this class of runner-image
      # breakage is tracked upstream at https://github.com/actions/runner-images/issues/10015.
      - name: Allow unprivileged user namespaces (Firefox/Chromium sandbox needs this on Ubuntu 24.04 runners)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned rather than left at the action's default "latest": with no version pinned, every run does an
          # extra "search latest release" round-trip against the GitHub API/CDN before downloading it, which is
          # both non-reproducible (a new wasm-pack release can silently change CI behaviour) and one more place a
          # transient failure (e.g. a release-download 504) can break an otherwise-unrelated change. Bump this
          # deliberately when a newer wasm-pack is actually needed.
          version: "v0.15.0"
      - name: Run the browser integration tests
        run: wasm-pack test --headless --${{ matrix.browser }}

  accessibility-tree-test:
    name: accessibility tree (CDP · Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Same Ubuntu 24.04 AppArmor/unprivileged-userns restriction worked around in `browser-tests` — this job also
      # launches a real, sandboxed Chrome (via `headless_chrome`/CDP), so it needs the identical fix.
      - name: Allow unprivileged user namespaces (Chrome sandbox needs this on Ubuntu 24.04 runners)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned rather than left at the action's default "latest": with no version pinned, every run does an
          # extra "search latest release" round-trip against the GitHub API/CDN before downloading it, which is
          # both non-reproducible (a new wasm-pack release can silently change CI behaviour) and one more place a
          # transient failure (e.g. a release-download 504) can break an otherwise-unrelated change. Bump this
          # deliberately when a newer wasm-pack is actually needed.
          version: "v0.15.0"

      - name: Chrome version (diagnostic — the runner image ships one, nothing to install)
        run: google-chrome --version || google-chrome-stable --version || chromium-browser --version

      # Builds the a11y-fixture wasm package, serves it locally, and drives the runner's own Chrome over
      # the DevTools Protocol — see the module doc comment in accessibility-tree-test/tests/accessibility_tree.rs
      # for what this verifies and why it is a separate job rather than folded into `browser-tests`: it needs
      # headless_chrome and a real local Chrome binary, neither of which the wasm-bindgen-test-based browser tests
      # require, and keeping it isolated means a failure here doesn't obscure results from the other jobs.
      - name: Run the accessibility-tree CDP integration test
        run: cargo test -p accessibility-tree-test

  coverage:
    name: coverage (host tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - uses: Swatinem/rust-cache@v2

      # llvm-cov instruments the host-runnable tests only (the `error` module — the demo gallery's own
      # host-runnable `highlight` tests moved out to the separate `svg-dom-demo` workspace crate along with the
      # rest of the demo implementation, and are not measured here). The DOM-bound `root`/`node`/`animate` code is
      # exercised by the wasm-pack browser tests in the `browser-tests` job, which cannot be instrumented here —
      # so this figure reflects the host-testable subset of the library crate, not the whole library.
      - name: Measure coverage (host-runnable tests)
        run: cargo llvm-cov nextest --all-features --no-report

      - name: Emit lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Coverage summary (job log)
        run: cargo llvm-cov report

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

  deny:
    name: cargo-deny (advisories · licenses · bans · sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check advisories, bans, licenses, and sources
        run: cargo deny check advisories bans licenses sources

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check the library builds on the declared MSRV
        run: cargo check --lib --target wasm32-unknown-unknown
