[package]
name = "svg-dom-demo"
version = "0.1.9"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
svg-dom = { path = ".." }
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "HtmlInputElement",
    "KeyboardEvent",
    "PointerEvent",
    "Window",
]

# Only used by browser_tests.rs — a wasm-bindgen-test browser suite exercising the demo gallery's interactive controls,
# run via `wasm-pack test --headless --firefox demo-app` (or `--chrome`)
#
# Not run by the native `cargo test -p svg-dom-demo` step: #[wasm_bindgen_test] compiles cleanly on any target but only
# actually registers tests when built for wasm32 (confirmed empirically — the root svg-dom crate's own tests/*.rs report
# "0 tests run" rather than a compile error under a native `cargo test`).
[dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies.web-sys]
version = "0.3"
features = [
    "KeyboardEventInit",
    "SvgGeometryElement",
]
