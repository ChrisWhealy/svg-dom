[alias]
# Build the wasm demo and serve it via the Actix demo-server at http://127.0.0.1:8080/demo/
#
# demo-server itself is a thin static-file server, not CPU-bound work. The wasm package it builds via `wasm-pack build`
# remains a release build regardless (that is wasm-pack's own default, independent of this alias), so demo-server's own
# profile has no effect on what actually needs to be fast.
demo = "run -p demo-server"
# Measure coverage of the host-runnable tests and open the HTML report. Covers the `error` module; the DOM-bound code is
# covered by the browser tests (`wasm-pack test`), which this cannot instrument. Needs `cargo-llvm-cov` and the
# `llvm-tools-preview` rustup component installed.
cov = "llvm-cov nextest --all-features --html --open"
